name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package (types needed by api typecheck)
        run: npm run build -w packages/shared

      - name: Type check workspaces
        run: npm run typecheck

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Type check infra
        run: npx tsc --noEmit
        working-directory: infra

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build shared package (needed for esbuild to resolve @litcrop/shared)
        run: npm run build -w packages/shared

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: CDK synth (dry-run, no AWS credentials needed)
        run: npx cdk synth
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: 'ap-northeast-1'
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: '1'

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [build, test, lint, typecheck, cdk-synth]
    if: always()

    steps:
      - name: Check results
        env:
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          RESULT_CDK_SYNTH: ${{ needs.cdk-synth.result }}
        run: |
          echo "## PR Quality Checks Summary"
          echo ""
          echo "Build:      ${RESULT_BUILD}"
          echo "Test:       ${RESULT_TEST}"
          echo "Lint:       ${RESULT_LINT}"
          echo "Type check: ${RESULT_TYPECHECK}"
          echo "CDK synth:  ${RESULT_CDK_SYNTH}"
          echo ""
          failed=false
          for result in "${RESULT_BUILD}" "${RESULT_TEST}" "${RESULT_LINT}" "${RESULT_TYPECHECK}" "${RESULT_CDK_SYNTH}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            echo "One or more checks failed. Review the logs above."
            exit 1
          else
            echo "All checks passed. Ready for review."
          fi
