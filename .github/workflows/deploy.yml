name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:
  deploy:
    # Guard: this workflow targets the private source-of-truth repo, which
    # holds the AWS OIDC role and `production` environment secrets. On the
    # public mirror (ashmuk/litcrop-public) the job is skipped — the file
    # remains as evidence of the CI/CD design.
    if: github.repository == 'ashmuk/litcrop'
    name: Deploy
    runs-on: ubuntu-latest
    environment: production   # CI-4: Triggers GitHub Environment approval gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clear Astro build cache
        run: rm -rf src/frontend/.astro src/frontend/dist

      - name: Build all workspaces
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_COGNITO_CLIENT_ID: ${{ vars.PUBLIC_COGNITO_CLIENT_ID }}
          PUBLIC_COGNITO_REGION: ${{ vars.PUBLIC_COGNITO_REGION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: CDK deploy (production)
        run: npx cdk deploy LitCropProd -c env=prod -c domain=litcrop.com -c hostedZoneId=<HOSTED_ZONE_ID> --require-approval never
        working-directory: infra
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
          SES_REGION: ${{ vars.SES_REGION }}

      - name: Sync frontend to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          # Hashed assets (_astro/*) — immutable, cache forever
          aws s3 sync src/frontend/dist/_astro/ "s3://${FRONTEND_BUCKET}/_astro/" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          # HTML + other files — no cache (ensures fresh content after deploy)
          aws s3 sync src/frontend/dist/ "s3://${FRONTEND_BUCKET}/" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "_astro/*" \
            --delete

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/*"

      - name: Post-deploy smoke test
        env:
          API_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          echo "Running smoke tests..."
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${API_URL}/health" || echo "000")
          if [ "$status" != "200" ]; then
            echo "FAIL: API health check returned $status"
            exit 1
          fi
          echo "PASS: API /health → 200"

          if [ -n "$FRONTEND_URL" ]; then
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$FRONTEND_URL" || echo "000")
            if [ "$status" != "200" ]; then
              echo "WARN: Frontend returned $status (may still be propagating)"
            else
              echo "PASS: Frontend → 200"
            fi
          fi
          echo "Smoke tests complete."

      - name: Deployment summary
        env:
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "Deployment completed."
          echo "Commit: ${GH_SHA}"
          echo "Actor:  ${GH_ACTOR}"
