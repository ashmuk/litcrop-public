<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"
     role="img" aria-label="LitCrop">
  <title>LitCrop</title>

  <!-- Earthy sandy background (matches the app's earthy theme) -->
  <rect x="0" y="0" width="32" height="32" rx="4" ry="4" fill="#E8DFC9"/>

  <!-- Four corner viewfinder brackets (warm brown — earthy, not gold) -->
  <g fill="none" stroke="#8F6B48" stroke-width="1.3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 8 L 4 4 L 8 4"/>
    <path d="M 24 4 L 28 4 L 28 8"/>
    <path d="M 4 24 L 4 28 L 8 28"/>
    <path d="M 24 28 L 28 28 L 28 24"/>
  </g>

  <!-- Sprout stem (sage green, upright) -->
  <path d="M 16 24 L 16 16"
        fill="none" stroke="#6B7F5E" stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Two sage-green leaves with subtle fill for 16px legibility -->
  <g fill="#6B7F5E" fill-opacity="0.2"
     stroke="#6B7F5E" stroke-width="1.35" stroke-linejoin="round">
    <g transform="translate(16 16) rotate(-55)">
      <path d="M 0 0 Q 3.2 -3.2, 7.2 -1 Q 4.6 1.8, 0 0 Z"/>
    </g>
    <g transform="translate(16 16) rotate(40) scale(1.1)">
      <path d="M 0 0 Q 3.4 -3.4, 7.6 -1.1 Q 4.8 1.9, 0 0 Z"/>
    </g>
  </g>

  <!-- Apex bud — warm earthy brown dot -->
  <circle cx="16" cy="15.7" r="0.95" fill="#8F6B48"/>
</svg>
